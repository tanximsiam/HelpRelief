services:
  - type: web
    name: helprelief-backend
    runtime: php
    plan: free
    buildCommand: |
      cd backend
      composer install --no-dev --optimize-autoloader
      php artisan key:generate --force
      php artisan config:cache
      php artisan route:cache
    startCommand: cd backend && heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: helprelief-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: helprelief-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: helprelief-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: helprelief-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: helprelief-db
          property: password
      - key: FRONTEND_URL
        value: https://helprelief.onrender.com
databases:
  - name: helprelief-db
    plan: free
